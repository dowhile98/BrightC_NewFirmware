# -----------------------------------------------------------------------------
# Peripherals & System
# -----------------------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_DMA=y
CONFIG_SPI=y
CONFIG_SPI_STM32_DMA=y
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384

# -----------------------------------------------------------------------------
# Wi-Fi & ESP-Hosted-MCU Coprocessor (SPI4)
# -----------------------------------------------------------------------------
CONFIG_WIFI=y
CONFIG_WIFI_ESP_HOSTED_MCU=y
CONFIG_ESP_HOSTED_MCU_INIT_PRIORITY=75
# Disable STM32H7 RMII Ethernet driver during Wi-Fi test so Wi-Fi STA is primary
CONFIG_ETH_DRIVER=n

# -----------------------------------------------------------------------------
# Networking Stack (IPv4 + DHCPv4 + TCP/UDP + DNS + Sockets)
# -----------------------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_WIFI_STA_AUTO_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_SOCKETS=y
CONFIG_TEST_RANDOM_GENERATOR=y

# -----------------------------------------------------------------------------
# Network Buffers & Management Events
# -----------------------------------------------------------------------------
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=2048

# -----------------------------------------------------------------------------
# Logging & Interactive Shell (Wi-Fi + Network)
# -----------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_ESP_HOSTED_MCU_LOG_LEVEL_DBG=y
CONFIG_WIFI_LOG_LEVEL_INF=y

CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_WIFI=y

CONFIG_WIFI_SAMPLE_SSID="TSL-I+D+I"
CONFIG_WIFI_SAMPLE_PSK="Tecna2026"